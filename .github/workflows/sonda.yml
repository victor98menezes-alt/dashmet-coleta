name: Sonda de fontes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar modelos Open-Meteo
        run: python sonda_modelos.py
      - name: Gravar resultado
        run: |
          git config user.name "coleta-meteorologica"
          git config user.email "coleta-meteorologica@users.noreply.github.com"
          git add -A saida/_sonda
          git commit -m "Sonda de fontes" || echo "Nada a gravar"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
